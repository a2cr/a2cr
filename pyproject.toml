[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2cr-mcp"
version = "0.1.1"
description = "A2CR local stdio MCP wrapper for WorkBaton and WorkStash."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
  { name = "A2CR" }
]
dependencies = [
  "cryptography==46.0.7",
  "fastmcp==3.2.4",
  "httpx==0.28.1",
  "tiktoken==0.9.0"
]

[project.urls]
Homepage = "https://a2cr.app/"
Documentation = "https://a2cr.app/en/manual"

[project.scripts]
a2cr-mcp = "a2cr_mcp.server:main"

[tool.setuptools.packages.find]
include = ["a2cr_mcp*"]
