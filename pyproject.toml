[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2cr-mcp"
version = "0.1.1"
description = "A2CR local stdio MCP wrapper for WorkBaton and WorkStash."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "A2CR" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "cryptography==46.0.7",
  "fastmcp==3.2.4",
  "httpx==0.28.1",
  "tiktoken==0.9.0"
]

[project.urls]
Homepage = "https://a2cr.app/"
Documentation = "https://a2cr.app/en/manual"

[project.scripts]
a2cr-mcp = "a2cr_mcp.server:main"

[tool.setuptools.packages.find]
include = ["a2cr_mcp*"]
