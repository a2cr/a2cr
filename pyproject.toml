[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2cr-mcp"
version = "0.1.8"
description = "Local MCP workspace for AI agent handoff checkpoints, WorkStash notes, and WorkThreads."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "A2CR" }
]
keywords = [
  "ai-agents",
  "agent-memory",
  "codex",
  "claude-code",
  "context-handoff",
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "workbaton",
  "workstash"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "cryptography==49.0.0",
  "fastmcp==3.4.4",
  "httpx==0.28.1",
  "tiktoken==0.13.0"
]

[project.urls]
Homepage = "https://github.com/a2cr/a2cr"
Documentation = "https://github.com/a2cr/a2cr/blob/main/docs/mcp-setup.md"
Source = "https://github.com/a2cr/a2cr"
Issues = "https://github.com/a2cr/a2cr/issues"
Changelog = "https://github.com/a2cr/a2cr/blob/main/CHANGELOG.md"
"MCP Registry" = "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.a2cr%2Fa2cr-mcp/versions/latest"

[project.scripts]
a2cr-mcp = "a2cr_mcp.server:main"
a2cr-local-mcp = "a2cr_mcp.entrypoints:local_main"
a2cr = "a2cr_mcp.local_workspace.cli:main"

[tool.setuptools.packages.find]
include = ["a2cr_mcp*"]
