[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2cr-mcp"
version = "0.1.6"
description = "MCP server for client-encrypted AI agent handoff checkpoints with WorkBaton and WorkStash."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "A2CR" }
]
keywords = [
  "ai-agents",
  "agent-memory",
  "codex",
  "claude-code",
  "context-handoff",
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "workbaton",
  "workstash"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "cryptography==48.0.1",
  "fastmcp==3.2.4",
  "httpx==0.28.1",
  "tiktoken==0.9.0"
]

[project.urls]
Homepage = "https://a2cr.app/"
Documentation = "https://a2cr.app/en/manual"
Source = "https://github.com/a2cr/a2cr"
Issues = "https://github.com/a2cr/a2cr/issues"
Changelog = "https://github.com/a2cr/a2cr/blob/main/CHANGELOG.md"
"MCP Registry" = "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.a2cr%2Fa2cr-mcp/versions/latest"

[project.scripts]
a2cr-mcp = "a2cr_mcp.server:main"

[tool.setuptools.packages.find]
include = ["a2cr_mcp*"]
