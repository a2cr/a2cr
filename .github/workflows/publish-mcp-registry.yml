name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish immutable metadata to the official MCP Registry. Leave false for validation only."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  publish-mcp-registry:
    name: Publish MCP Registry metadata
    if: ${{ github.repository == 'a2cr/a2cr' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test runner
        run: python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m pip install build && python -m build --sdist --wheel

      - name: Confirm PyPI release exists
        run: |
          python - <<'PY'
          import json
          import urllib.request

          expected = "0.1.5"
          with urllib.request.urlopen("https://pypi.org/pypi/a2cr-mcp/json", timeout=20) as response:
              data = json.load(response)
          versions = set(data.get("releases", {}))
          if expected not in versions:
              raise SystemExit(f"a2cr-mcp=={expected} is not published on PyPI yet")
          PY

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate MCP Registry metadata
        if: ${{ inputs.publish == 'false' }}
        run: ./mcp-publisher validate server.json

      - name: Publish MCP Registry metadata
        if: ${{ inputs.publish == 'true' }}
        run: ./mcp-publisher publish server.json
