name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    name: Python package tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test runner
        run: python -m pip install -e . pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build package metadata
        run: python -m pip install build && python -m build --sdist --wheel
